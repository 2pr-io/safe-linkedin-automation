<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B00B6"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="62" font-size="30" font-weight="700" fill="#1A1A2E">Your LinkedIn network, turned into a to-do list. Safely.</text>
  <text x="40" y="94" font-size="17" fill="#55556A">LinkedIn has to give you your own data. This skill fetches it, reads it on your laptop and shows you what to do.</text>

  <!-- A: LinkedIn export -->
  <rect x="40" y="170" width="220" height="200" rx="16" fill="#F4EEFC" stroke="#5B00B6" stroke-width="2"/>
  <text x="60" y="206" font-size="13" font-weight="700" fill="#5B00B6" letter-spacing="1">1 · LINKEDIN</text>
  <text x="60" y="236" font-size="20" font-weight="700" fill="#1A1A2E">Your data export</text>
  <text x="60" y="266" font-size="15" fill="#33334A">Free, and yours by law</text>
  <text x="60" y="288" font-size="15" fill="#33334A">(GDPR right of access)</text>
  <text x="60" y="320" font-size="15" fill="#33334A">Every connection,</text>
  <text x="60" y="342" font-size="15" fill="#33334A">message and invite</text>

  <!-- A to B -->
  <line x1="262" y1="270" x2="366" y2="270" stroke="#5B00B6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="314" y="256" font-size="13" font-weight="600" fill="#5B00B6" text-anchor="middle">2 clicks</text>
  <text x="314" y="296" font-size="13" fill="#55556A" text-anchor="middle">every 44-52 h</text>
  <text x="314" y="314" font-size="13" fill="#55556A" text-anchor="middle">random hour</text>

  <!-- B: laptop -->
  <rect x="370" y="170" width="220" height="200" rx="16" fill="#F4EEFC" stroke="#5B00B6" stroke-width="2"/>
  <text x="390" y="206" font-size="13" font-weight="700" fill="#5B00B6" letter-spacing="1">2 · YOUR LAPTOP</text>
  <text x="390" y="236" font-size="20" font-weight="700" fill="#1A1A2E">Your archive</text>
  <text x="390" y="266" font-size="15" fill="#33334A">9,895 connections</text>
  <text x="390" y="288" font-size="15" fill="#33334A">19,828 messages</text>
  <text x="390" y="320" font-size="15" fill="#33334A">Nothing is uploaded</text>
  <text x="390" y="342" font-size="15" fill="#33334A">anywhere</text>

  <!-- B to C (three) -->
  <path d="M592,270 C620,270 620,165 646,165" fill="none" stroke="#5B00B6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="592" y1="270" x2="646" y2="270" stroke="#5B00B6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M592,270 C620,270 620,375 646,375" fill="none" stroke="#5B00B6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- C1: report -->
  <rect x="650" y="120" width="290" height="90" rx="14" fill="#FFFFFF" stroke="#5B00B6" stroke-width="2"/>
  <text x="668" y="148" font-size="13" font-weight="700" fill="#5B00B6" letter-spacing="1">3 · REPORT</text>
  <text x="668" y="174" font-size="15" fill="#1A1A2E"><tspan font-weight="700">42</tspan> waiting on your reply</text>
  <text x="668" y="196" font-size="15" fill="#1A1A2E"><tspan font-weight="700">291</tspan> of 434 new connections ignored</text>

  <!-- C2: CRM -->
  <rect x="650" y="225" width="290" height="90" rx="14" fill="#FFFFFF" stroke="#5B00B6" stroke-width="2"/>
  <text x="668" y="253" font-size="13" font-weight="700" fill="#5B00B6" letter-spacing="1">3 · CRM FILE</text>
  <text x="668" y="279" font-size="15" fill="#1A1A2E">A status for every person:</text>
  <text x="668" y="301" font-size="15" fill="#1A1A2E"><tspan font-weight="700">6,219</tspan> you never talked to</text>

  <!-- C3: enrich -->
  <rect x="650" y="330" width="290" height="90" rx="14" fill="#FFFFFF" stroke="#5B00B6" stroke-width="2"/>
  <text x="668" y="358" font-size="13" font-weight="700" fill="#5B00B6" letter-spacing="1">3 · ENRICH</text>
  <text x="668" y="384" font-size="15" fill="#1A1A2E">Role, ideal-customer fit,</text>
  <text x="668" y="406" font-size="15" fill="#1A1A2E">company. No scraping.</text>

  <!-- C to D -->
  <path d="M942,165 C966,165 966,270 986,270" fill="none" stroke="#5B00B6" stroke-width="2.5"/>
  <line x1="942" y1="270" x2="986" y2="270" stroke="#5B00B6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M942,375 C966,375 966,270 986,270" fill="none" stroke="#5B00B6" stroke-width="2.5"/>

  <!-- D: you act -->
  <rect x="990" y="170" width="170" height="200" rx="16" fill="#5B00B6"/>
  <text x="1008" y="206" font-size="13" font-weight="700" fill="#E5D4FA" letter-spacing="1">4 · YOU ACT</text>
  <text x="1008" y="240" font-size="16" font-weight="700" fill="#FFFFFF">Reply first</text>
  <text x="1008" y="276" font-size="16" font-weight="700" fill="#FFFFFF">Say hello</text>
  <text x="1008" y="296" font-size="16" font-weight="700" fill="#FFFFFF">within a week</text>
  <text x="1008" y="332" font-size="16" font-weight="700" fill="#FFFFFF">Post for all</text>
  <text x="1008" y="352" font-size="16" font-weight="700" fill="#FFFFFF">of them</text>

  <!-- Divider -->
  <line x1="40" y1="470" x2="1160" y2="470" stroke="#E4E4EC" stroke-width="2"/>
  <text x="40" y="510" font-size="20" font-weight="700" fill="#1A1A2E">Why this is safe, and most LinkedIn automation is not</text>

  <!-- Avoid panel -->
  <rect x="40" y="530" width="550" height="180" rx="16" fill="#FDF0F0" stroke="#D64545" stroke-width="2"/>
  <text x="64" y="566" font-size="17" font-weight="700" fill="#B42323">Bots that act as you: avoid</text>
  <text x="64" y="598" font-size="15" fill="#33334A">✕  Auto-invites and auto-DM sequences</text>
  <text x="64" y="624" font-size="15" fill="#33334A">✕  Auto-likes, auto-comments, engagement pods</text>
  <text x="64" y="650" font-size="15" fill="#33334A">✕  Scraping profiles through your login</text>
  <text x="64" y="686" font-size="15" font-weight="700" fill="#B42323">Risk: an account most people value at $100k+</text>

  <!-- Safe panel -->
  <rect x="610" y="530" width="550" height="180" rx="16" fill="#EEF8F1" stroke="#2E9E5B" stroke-width="2"/>
  <text x="634" y="566" font-size="17" font-weight="700" fill="#1E7A44">This skill: reads your own file</text>
  <text x="634" y="598" font-size="15" fill="#33334A">✓  A feature LinkedIn must offer you</text>
  <text x="634" y="624" font-size="15" fill="#33334A">✓  2 clicks on a settings page, in your own browser</text>
  <text x="634" y="650" font-size="15" fill="#33334A">✓  Stops at any password, code or captcha</text>
  <text x="634" y="686" font-size="15" font-weight="700" fill="#1E7A44">Never sends an invite, message, like or comment</text>

  <!-- Footer -->
  <text x="40" y="742" font-size="14" fill="#77778A">github.com/2pr-io/safe-linkedin-automation</text>
  <text x="1160" y="742" font-size="14" fill="#77778A" text-anchor="end">Free and open source · made by 2pr.io</text>
</svg>
